name: abrova_push_desktop
description: Push notifications and in-app messages for Flutter apps on macOS, Windows and Linux, with an optional tray and start with the computer. No Firebase.
version: 0.1.0
homepage: https://abrova.ir/cloud/abrova-push
repository: https://github.com/Abrova-co/abrova_push_desktop
publish_to: https://center.abrova.ir/api/packages/abrova/pub
platforms:
  macos:
  windows:
  linux:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  crypto: ^3.0.8
  device_info_plus: ">=12.4.0 <14.0.0"
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  http: ^1.6.0
  mqtt_client: ^10.14.0
  package_info_plus: ">=9.0.1 <11.0.0"
  path_provider: ^2.1.6
  tray_manager: ^0.5.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

